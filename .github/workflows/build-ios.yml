name: Build WindowsiOS for iPhone and iPad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen meson ninja pkgconf

      - name: Build iOS dependencies and VM library
        run: |
          ./scripts/build_ios_deps.sh
          make -j"$(sysctl -n hw.ncpu)" ios-lib

      - name: Build unsigned arm64 app
        run: |
          xcodegen generate --spec ios/project.yml
          xcodebuild build \
            -project ios/WindowsiOS.xcodeproj \
            -scheme WindowsiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify and package app
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/WindowsiOS.app
          plutil -lint "$app/Info.plist"
          xcrun lipo -verify_arch arm64 "$app/WindowsiOS"
          ditto -c -k --keepParent "$app" build/WindowsiOS-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v7
        with:
          name: WindowsiOS-unsigned
          path: build/WindowsiOS-unsigned.zip
          if-no-files-found: error

      - name: Upload dependency build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-dependency-build-logs
          path: work/ios_deps_build/*.log
          if-no-files-found: ignore
